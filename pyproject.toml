[project]
name = "assignments"
version = "0.1.0"
authors=[
	{name = "Fernando Cordeiro<fernando@daredata.engineering>"},
	{name = "David Viana<me@davidviana.com>"},
]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "life-expectancy",
    "setuptools<81",
]

[tool.uv.workspace]
members = [
    "life_expectancy",
]

[tool.uv.sources]
life-expectancy = { workspace = true }

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "toml>=0.10.2",
]

[tool.coverage.run]
omit = [
    "*/conftest.py", "*/test*", # omit test files
]

