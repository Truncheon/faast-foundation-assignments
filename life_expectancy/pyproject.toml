[project]
name = "life_expectancy"
version = "0.1.0"
authors=[
	{name = "Fernando Cordeiro<fernando@daredata.engineering>"},
	{name = "David Viana<me@davidviana.com>"},
]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
